[project]
name = "smcevolve"
version = "0.1.0"
description = "SMC sampler for LLM-driven program evolution"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "numpy>=1.24",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "flask>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smcevolve"]
